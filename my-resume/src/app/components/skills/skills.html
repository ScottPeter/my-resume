<mat-card class="section-card skills-card">
  <mat-card-header>
    <mat-card-title>Skills</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="skills-container">
      @for (skill of skills(); track skill) {
        <mat-chip>{{ skill }}</mat-chip>
      }
    </div>
  </mat-card-content>
</mat-card>
